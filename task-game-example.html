<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAWRAS Quick Quiz</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
    .card { max-width: 560px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 24px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .options { display: grid; gap: 10px; margin: 16px 0; }
    button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: inherit; cursor: pointer; text-align: start; }
    button:hover, button:focus-visible { border-color: #38bdf8; }
    .progress { opacity: 0.7; font-size: 0.9rem; }
    .done { text-align: center; }
  </style>
</head>
<body>
  <main class="card" id="app"></main>
  <script>
    // On NAWRAS, "NawrasTask.complete" is injected automatically for pasted/uploaded HTML.
    // This fallback makes the same file work when hosted at a URL.
    window.NawrasTask = window.NawrasTask || {
      complete(result) {
        parent.postMessage(Object.assign({}, result, { type: "nawras-task-complete" }), "*");
      }
    };

    const questions = [
      { q: "What does HTML stand for?", options: ["HyperText Markup Language", "High Tech Modern Language", "Home Tool Markup Language"], answer: 0 },
      { q: "Which tag makes a link?", options: ["<link>", "<a>", "<href>"], answer: 1 },
      { q: "Which language styles a web page?", options: ["Python", "CSS", "SQL"], answer: 1 }
    ];
    let index = 0;
    let score = 0;
    const answers = [];
    const app = document.getElementById("app");

    function render() {
      if (index >= questions.length) return finish();
      const item = questions[index];
      app.innerHTML = "";
      const progress = document.createElement("p");
      progress.className = "progress";
      progress.textContent = `Question ${index + 1} of ${questions.length}`;
      const title = document.createElement("h1");
      title.textContent = item.q;
      const options = document.createElement("div");
      options.className = "options";
      item.options.forEach((text, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        button.addEventListener("click", () => {
          const correct = optionIndex === item.answer;
          if (correct) score += 1;
          answers.push({ question: item.q, chosen: text, correct });
          index += 1;
          render();
        });
        options.appendChild(button);
      });
      app.append(progress, title, options);
    }

    function finish() {
      app.innerHTML = `<div class="done"><h1>Finished!</h1><p>You scored ${score} / ${questions.length}.</p><p>Your result has been sent for review.</p></div>`;
      NawrasTask.complete({
        score,
        maxScore: questions.length,
        summary: `Scored ${score} of ${questions.length} in the quick quiz`,
        details: answers
      });
    }

    render();
  </script>
</body>
</html>
